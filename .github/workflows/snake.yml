name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *" # roda a cada 6 horas
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Lucas-RCS
          outputs: |
            dist/github-snake.svg?color_snake=#a98aff&color_dots=#2d1f3d,#4a2f6b,#603f80,#734a99,#8654b3&color_empty=#222222
            dist/github-snake-dark.svg?color_snake=#a98aff&color_dots=#2d1f3d,#4a2f6b,#603f80,#734a99,#8654b3&color_empty=#222222

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
